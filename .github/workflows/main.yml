name: india_air_quality_json

# Run workflow manually
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_REGION: ${{ secrets.SNOWFLAKE_REGION }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE || 'SYSADMIN' }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE || 'dev_db' }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA || 'stage_sch' }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE || 'load_wh' }}
      SNOWFLAKE_STAGE: ${{ secrets.SNOWFLAKE_STAGE }}
      AQI_LIMIT: ${{ secrets.AQI_LIMIT || '4000' }}

    steps:

      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Find Python file
      - name: Check repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository structure:"
          ls -la

          echo "Find Python files:"
          find . -type f -name "ingest-api-data.py"

      # Step 3: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install snowflake-snowpark-python requests pytz

      # Step 5: Run AQI ingestion
      # - name: Run AQI ingestion
      #   run: |
      #     python ./e2e-project-udemy/04-snowpark-python/ingest-api-data.py

      - name: Find and run AQI ingestion script
  env:
    DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
    SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
    SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  run: |
    echo "Current working directory:"
    pwd

    echo "All Python files:"
    find . -type f -name "*.py"

    echo "Searching for ingestion script..."

    FILE_PATH=$(find . -type f -name "ingest-api-data.py" | head -n 1)

    if [ -z "$FILE_PATH" ]; then
      echo "ERROR: ingest-api-data.py not found!"
      echo "Please check whether the file is committed to GitHub."
      exit 1
    fi

    echo "Found file: $FILE_PATH"

    python "$FILE_PATH"
